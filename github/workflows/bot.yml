name: Fetch News Automatically

on:
  schedule:
    - cron: '*/15 * * * *' # يعمل كل 15 دقيقة
  workflow_dispatch: # يسمح لك بتشغيله يدوياً للتجربة

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run News Bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node bot.js