<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>خريطة الأحداث | وكالة الغيب</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<!-- مكتبة الخرائط Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    :root { --bg: #09090b; --surface: #18181b; --text: #f4f4f5; --brand: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; font-family: 'IBM Plex Sans Arabic', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    
    /* شريط علوي بسيط */
    .header { height: 60px; background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #27272a; position: relative; z-index: 1000; }
    .header h1 { font-size: 1.2rem; color: var(--brand); }
    .btn-back { color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.9rem; background: #27272a; padding: 8px 16px; border-radius: 8px; transition: 0.2s; }
    .btn-back:hover { background: var(--brand); }

    /* حاوية الخريطة */
    #map { height: calc(100vh - 60px); width: 100%; background: #000; }

    /* تخصيص شكل النوافذ المنبثقة للخريطة */
    .leaflet-popup-content-wrapper { background: var(--surface); color: var(--text); border-radius: 12px; padding: 0; overflow: hidden; border: 1px solid #3f3f46; }
    .leaflet-popup-content { margin: 0; width: 280px !important; }
    .leaflet-popup-tip { background: var(--surface); }
    .popup-img { width: 100%; height: 120px; object-fit: cover; }
    .popup-body { padding: 16px; }
    .popup-title { font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: var(--brand); }
    .popup-desc { font-size: 0.85rem; color: #a1a1aa; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    
    /* علامة النبض للأخبار العاجلة */
    .pulse-marker { width: 20px; height: 20px; background: rgba(239, 68, 68, 0.8); border-radius: 50%; box-shadow: 0 0 0 0 rgba(239, 68, 68, 1); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
</style>
</head>
<body>

<div class="header">
    <h1>خريطة الأحداث العالمية</h1>
    <a href="index.html" class="btn-back">&larr; العودة للرئيسية</a>
</div>

<div id="map"></div>

<script>
    const SUPABASE_URL = "https://vmaxbnogmmfyrcucapnq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_D3c88u75_LcEN460Y3Jcpw__EfqUnBx";

    // إحداثيات الدول (يمكنك إضافة المزيد لاحقاً)
    const countryCoords = {
        'السعودية': [23.8859, 45.0792],
        'الولايات المتحدة': [37.0902, -95.7129],
        'روسيا': [61.5240, 105.3188],
        'الصين': [35.8617, 104.1954],
        'فلسطين': [31.9522, 35.2332],
        'أوكرانيا': [48.3794, 31.1656],
        'إيران': [32.4279, 53.6880],
        'تركيا': [38.9637, 35.2433],
        'مصر': [26.8206, 30.8025],
        'اليمن': [15.5527, 48.5164],
        'الإمارات': [23.4241, 53.8478],
        'فرنسا': [46.2276, 2.2137],
        'ألمانيا': [51.1657, 10.4515],
        'بريطانيا': [55.3781, -3.4360],
        'اليابان': [36.2048, 138.2529]
    };

    // 1. تهيئة الخريطة (بمظهر داكن احترافي)
    const map = L.map('map').setView([25, 20], 2); // البداية من الشرق الأوسط والعالم

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    // 2. جلب الأخبار وتحديد مواقعها على الخريطة
    async function loadMapNews() {
        try {
            // جلب الأخبار من قاعدة البيانات (التي لها دولة محددة)
            const res = await fetch(`${SUPABASE_URL}/rest/v1/articles?select=*&country=not.is.null&order=published_at.desc&limit=50`, {
                headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
            });
            const data = await res.json();

            data.forEach(article => {
                const coords = countryCoords[article.country];
                if (coords) {
                    // إذا كان هناك أخبار في نفس الدولة، قد نريد وضع علامة واحدة تمثلها أو وضع علامات متعددة
                    // هنا نضع علامة لكل خبر، ولكن يمكننا تجميعها
                    
                    // تحديد لون العلامة بناءً على القسم أو الأهمية
                    let markerColor = article.category === 'security' ? '#ef4444' : (article.category === 'economy' ? '#f59e0b' : '#3b82f6');
                    
                    // إنشاء أيقونة دائرية ملونة
                    const customIcon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div style="background-color: ${markerColor}; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 10px ${markerColor};"></div>`,
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    });

                    // إنشاء العلامة على الخريطة
                    const marker = L.marker(coords, {icon: customIcon}).addTo(map);

                    // محتوى النافذة المنبثقة
                    const popupContent = `
                        <img src="${article.image_url || 'https://picsum.photos/300/200'}" class="popup-img">
                        <div class="popup-body">
                            <div class="popup-title">${article.country}: ${article.title}</div>
                            <div class="popup-desc">${article.summary}</div>
                            <a href="#" style="display:inline-block; margin-top:10px; color:var(--brand); font-size:0.85rem; font-weight:bold; text-decoration:none;">اقرأ التفاصيل &larr;</a>
                        </div>
                    `;

                    marker.bindPopup(popupContent);
                }
            });

        } catch (error) {
            console.error("خطأ في تحميل بيانات الخريطة:", error);
        }
    }

    // 3. بيانات تجريبية للخريطة (لتظهر بشكل جميل قبل إضافة أخبار لدول)
    function addMockData() {
        // نضع بعض العلامات الوهمية لكي لا تبدو الخريطة فارغة
        const mockPoints = [
            { country: 'السعودية', cat: 'politics', title: 'قمة خليجية طارئة في الرياض', desc: 'يجتمع قادة الخليج لبحث التطورات الإقليمية...' },
            { country: 'فلسطين', cat: 'security', title: 'تطورات ميدانية في قطاع غزة', desc: 'استمرار الجهود الدبلوماسية لوقف إطلاق النار...' },
            { country: 'أوكرانيا', cat: 'security', title: 'تحركات عسكرية في شرق أوروبا', desc: 'حلف الناتو يعزز وجوده في المنطقة...' },
            { country: 'الولايات المتحدة', cat: 'economy', title: 'الفيدرالي يثبت أسعار الفائدة', desc: 'الأسواق تترقب قرارات البنك المركزي...' }
        ];

        mockPoints.forEach(p => {
            const coords = countryCoords[p.country];
            if(coords) {
                let color = p.cat === 'security' ? '#ef4444' : (p.cat === 'economy' ? '#f59e0b' : '#3b82f6');
                const icon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="background-color: ${color}; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 10px ${color};"></div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                const m = L.marker(coords, {icon: icon}).addTo(map);
                m.bindPopup(`<div class="popup-body"><div class="popup-title">${p.country}</div><div class="popup-desc">${p.title} - ${p.desc}</div></div>`);
            }
        });
    }

    // تشغيل الخريطة
    addMockData(); // أضف بيانات تجريبية
    loadMapNews(); // جلب الأخبار الحقيقية من قاعدة البيانات

</script>
</body>
</html>
