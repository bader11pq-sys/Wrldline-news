<title>NEWS/GLOBAL — المنصة الإعلامية العالمية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#ffffff; --bg-2:#f5f6f8; --bg-3:#eef0f3; --elev:#ffffff; --text:#15191F; --text-2:#4a5568; --text-3:#8a94a6; --border:#e5e7eb; --border-2:#d1d5db; --accent:#C62828; --accent-2:#a01f1f; --accent-soft:#fdecec; --green:#10b981; --blue:#3b82f6; --amber:#f59e0b; --gray:#6b7280; --shadow-sm:0 1px 3px rgba(15,20,30,.06); --shadow:0 4px 16px rgba(15,20,30,.08); --shadow-lg:0 20px 60px rgba(15,20,30,.18); --radius:14px; --radius-sm:10px; --header-h:64px; }
[data-theme="dark"]{ --bg:#0b0e13; --bg-2:#11151c; --bg-3:#171c25; --elev:#141922; --text:#e7ecf3; --text-2:#a7b0c0; --text-3:#6b7484; --border:#232a36; --border-2:#2d3441; --accent:#ef4444; --accent-2:#dc2626; --accent-soft:#2a1518; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0} html{scroll-behavior:smooth} body{font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; font-size:15px; -webkit-font-smoothing:antialiased; transition:background .3s;} img{max-width:100%;display:block;object-fit:cover} a{color:inherit;text-decoration:none} button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.header{position:sticky; top:0; z-index:100; background:var(--bg); border-bottom:1px solid var(--border);} .header-inner{max-width:1360px; margin:0 auto; padding:0 24px; height:var(--header-h); display:flex; align-items:center; gap:24px;}
.logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px;} .logo-mark{width:34px; height:34px; border-radius:9px; background:var(--text); color:var(--bg); display:grid; place-items:center; font-weight:800; font-size:15px;} .logo-text small{font-size:9px; font-weight:600; color:var(--text-3); letter-spacing:.18em; margin-top:3px}

.container{max-width:1360px; margin:0 auto; padding:0 24px} main{padding:28px 0 0}
.hero-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:22px; margin-bottom:36px} .hero-main{position:relative; border-radius:var(--radius); overflow:hidden; aspect-ratio:16/10; background:var(--bg-3);} .hero-main img{width:100%; height:100%} .hero-overlay{position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 42%, transparent 100%); display:flex; flex-direction:column; justify-content:flex-end; padding:28px; color:#fff;} .hero-main h2{font-size:30px; line-height:1.25; font-weight:700; margin-bottom:10px} .hero-main p{font-size:14px; opacity:.88;}
.hero-side{display:flex; flex-direction:column; gap:14px} .side-card{display:grid; grid-template-columns:1fr 110px; gap:14px; padding:14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--elev);} .side-card h3{font-size:15px; font-weight:600; line-height:1.35;} .side-card img{width:110px; height:82px; border-radius:8px;}
.badge{display:inline-flex; align-items:center; padding:3px 9px; border-radius:6px; font-size:10.5px; font-weight:700; background:var(--bg-2); margin-bottom: 6px; color:var(--text);} .badge-cat{background:var(--text); color:var(--bg);}
.news-list{display:grid; grid-template-columns:1fr 1fr; gap:0 40px; border-top:1px solid var(--border);} .news-row{display:grid; grid-template-columns:1fr 130px; gap:18px; padding:18px 0; border-bottom:1px solid var(--border);} .news-row-title{font-size:16px; font-weight:600; line-height:1.4;} .news-row-summary{font-size:13px; color:var(--text-2);} .news-row-img{width:130px; height:88px; border-radius:8px;}
.section-head{display:flex; align-items:center; gap:14px; margin-bottom:18px; border-bottom:1px solid var(--border); padding-bottom:12px;} .section-head h2{font-size:20px; font-weight:700; display:flex; align-items:center; gap:10px;} .section-head h2::before{content:""; width:4px; height:20px; background:var(--accent);}
.to-top{position:fixed; inset-block-end:24px; inset-inline-end:24px; width:44px; height:44px; border-radius:12px; background:var(--text); color:var(--bg); display:grid; place-items:center; z-index:150; opacity:0; pointer-events:none;}
@media (max-width:1100px){ .nav{display:none} .hero-grid{grid-template-columns:1fr} .hero-side{flex-direction:row; overflow-x:auto;} .side-card{min-width:280px} }
@media (max-width:760px){ .container{padding:0 16px} .hero-main h2{font-size:22px} .news-list{grid-template-columns:1fr} }
</style>
</head>

    </a>

  </section>
</main>
