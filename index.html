<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>الغيب | Al Ghaib News — وكالة الأنباء العالمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط الأسعار العلوي -->
    <div class="markets-bar">
        <div class="markets-inner" id="marketsTicker"></div>
    </div>

    <!-- الترويسة (رويترز ستايل) -->
    <header class="main-header">
        <div class="header-top">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <div class="logo" onclick="window.scrollTo(0,0)">
                <span class="logo-ar">الغيب</span>
                <span class="logo-en">AL GHAIB NEWS</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleSearch()">🔍</button>
                <button class="icon-btn" onclick="toggleLang()" id="langBtn">EN</button>
                <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
            </div>
        </div>
        
        <!-- القائمة الرئيسية -->
        <nav class="main-nav" id="mainNav">
            <a href="#" class="nav-item active" onclick="filterCategory('all', this)">الرئيسية</a>
            <a href="#" class="nav-item" onclick="filterCategory('politics', this)">سياسة</a>
            <a href="#" class="nav-item" onclick="filterCategory('economy', this)">اقتصاد</a>
            <a href="#" class="nav-item" onclick="filterCategory('security', this)">أمن ودفاع</a>
            <a href="#" class="nav-item" onclick="filterCategory('tech', this)">تكنولوجيا</a>
            <a href="#" class="nav-item" onclick="filterCategory('sports', this)">رياضة</a>
            <a href="#" class="nav-item" onclick="filterCategory('culture', this)">ثقافة</a>
        </nav>
    </header>

    <!-- شريط الأخبار العاجلة -->
    <div class="breaking-bar" id="breakingBar">
        <span class="live-dot"></span>
        <span class="breaking-text" id="breakingText">جاري التحميل...</span>
    </div>

    <main class="main-content container">
        
        <!-- تخطيط رويترز: خبر رئيسي + أخبار جانبية -->
        <section class="hero-layout" id="heroLayout">
            <!-- سيتم تعبئته بواسطة JS -->
        </section>

        <!-- الفلاتر (دولة) -->
        <section class="filters-section">
            <h2 class="section-title">آخر الأخبار</h2>
            <select id="countryFilter" class="country-select" onchange="filterCountry(this.value)">
                <option value="all">🌍 كل الدول</option>
            </select>
        </section>

        <!-- شبكة الأخبار -->
        <section class="news-grid" id="newsGrid">
            <!-- سيتم تعبئته بواسطة JS -->
        </section>

        <!-- زر تحميل المزيد -->
        <div class="load-more-wrap" id="loadMoreWrap">
            <button class="btn-load-more" onclick="loadMore()">تحميل المزيد من الأخبار</button>
        </div>

    </main>

    <!-- التذييل -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-logo">الغيب | AL GHAIB NEWS</div>
            <p>منصة إعلامية عالمية رقمية. تغطية معمقة وتحليلات استراتيجية.</p>
            <div class="footer-links">
                <a href="#">من نحن</a>
                <a href="#">سياسة الخصوصية</a>
                <a href="#">اتصل بنا</a>
            </div>
        </div>
    </footer>

    <!-- نافذة قراءة الخبر (Modal) -->
    <div class="modal-overlay" id="articleModal">
        <div class="modal-content" id="modalContent">
            <!-- سيتم تعبئته بواسطة JS -->
        </div>
    </div>

    <!-- شاشة البحث -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن خبر..." oninput="handleSearch(this.value)">
            <button class="close-search" onclick="toggleSearch()">✕</button>
        </div>
        <div class="search-results" id="searchResults"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
