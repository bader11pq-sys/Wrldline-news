name: Validate interactive history module
on:
  push:
    branches: [main]
    paths:
      - 'history*.html'
      - 'history*.js'
      - 'supabase/migrations/**'
      - 'supabase/seed/**'
      - 'tests/history-current.test.js'
      - '.github/workflows/history-validation.yml'
  pull_request:
    paths:
      - 'history*.html'
      - 'history*.js'
      - 'tests/history-current.test.js'
      - '.github/workflows/history-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.0'
      - name: Check current and retained history module syntax
        run: for file in history*.js; do node --check "$file"; done
      - name: Verify current page assets, initialization order, and retained research schema
        run: node --test tests/history-current.test.js
