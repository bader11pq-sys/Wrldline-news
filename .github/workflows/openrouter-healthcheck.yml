name: OpenRouter API Healthcheck
on:
  push:
    branches: [main]
    paths:
      - 'openrouter-healthcheck.js'
  workflow_dispatch:
jobs:
  verify-openrouter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify OpenRouter key and free model response
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node openrouter-healthcheck.js
