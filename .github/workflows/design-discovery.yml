name: Worldline Design Discovery

on:
  push:
    branches: [main]
    paths:
      - "design-agent/**"
      - "scripts/design-agent/**"
      - "tests/test_design_agent_*.py"
      - ".github/workflows/design-discovery.yml"
  workflow_dispatch:
    inputs:
      source_limit:
        description: "Optional maximum number of reference sites (0 = all)"
        required: false
        default: "0"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: worldline-design-discovery
  cancel-in-progress: false

jobs:
  capture-public-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: "3.12.8"

      - name: Install pinned browser
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install chromium

      - name: Validate catalog, analyzer tests, and Python syntax
        run: |
          python tests/test_design_agent_catalog.py
          python tests/test_design_agent_analyzer.py
          python -m py_compile scripts/design-agent/capture_references.py scripts/design-agent/analyze_references.py

      - name: Capture reference homepages
        run: |
          python scripts/design-agent/capture_references.py --limit "${{ github.event.inputs.source_limit || '0' }}"

      - name: Analyze screenshots with Gemini and Groq fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GROQ_VISION_MODEL: ${{ vars.GROQ_VISION_MODEL || 'qwen/qwen3.8-27b' }}
        run: python scripts/design-agent/analyze_references.py

      - name: Upload visual research artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: worldline-design-references-${{ github.run_id }}
          path: artifacts/design-discovery/
          if-no-files-found: warn
          retention-days: 14
