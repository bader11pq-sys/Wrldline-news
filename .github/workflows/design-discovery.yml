name: Worldline Design Discovery

on:
  workflow_dispatch:
    inputs:
      source_limit:
        description: "Optional maximum number of reference sites (0 = all)"
        required: false
        default: "0"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: worldline-design-discovery
  cancel-in-progress: false

jobs:
  capture-public-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: "3.12.8"

      - name: Install pinned browser
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install chromium

      - name: Validate catalog and Python syntax
        run: |
          python tests/test_design_agent_catalog.py
          python -m py_compile scripts/design-agent/capture_references.py

      - name: Capture reference homepages
        run: |
          python scripts/design-agent/capture_references.py --limit "${{ github.event.inputs.source_limit || '0' }}"

      - name: Upload visual research artifact
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4.6.2
        if: always()
        with:
          name: worldline-design-references-${{ github.run_id }}
          path: artifacts/design-discovery/
          if-no-files-found: warn
          retention-days: 14
