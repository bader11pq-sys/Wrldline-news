name: WRLDLINE retired RSS status (manual)
# Diagnostic only. This is neither an ingestion job nor a fallback.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wrldline-news-ingestion
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ae5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Report that legacy RSS collection is disabled
        run: node bot-ingest.js
