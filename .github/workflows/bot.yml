name: WRLDLINE Multi-source News Ingestion
# Gemini → Groq → OpenRouter fallback; quota-safe pending-story processing.
on:
  push:
    branches: [main]
    paths:
      - 'bot-ingest.js'
      - '.github/workflows/bot.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: wrldline-news-ingestion
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Arabic and international news sources in parallel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node bot-ingest.js
