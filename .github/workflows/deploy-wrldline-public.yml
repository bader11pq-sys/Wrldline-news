name: Deploy WRLDLINE public Worker

# Why this workflow exists
# -----------------------
# Production article, section, RSS and sitemap pages are generated by the
# Cloudflare Worker in cloudflare/workers/wrldline-public. Until now that Worker
# was only ever deployed by hand, so the live bundle could not be matched to any
# commit. This workflow makes the Worker a release artifact:
#
#   push to main  ->  tests  ->  preview deploy  ->  parity report
#                                                  |
#                                        manual approval (production-worker
#                                        environment, required reviewers)
#                                                  |
#                                            production deploy
#                                                  |
#                                    strict verification of the live commit
#
# A push to main never reaches production on its own. Production is only
# promotable through a workflow_dispatch run, and that job sits behind an
# environment with required reviewers.

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/workers/wrldline-public/**'
      - 'tests/deploy-config.test.js'
      - 'tests/worker-version.test.js'
      - 'tests/worker-asset-pins.test.js'
      - 'tests/public-news.test.js'
      - 'scripts/verify-deployment.mjs'
      - 'scripts/worker-parity.mjs'
      - '.github/workflows/deploy-wrldline-public.yml'
  workflow_dispatch:
    inputs:
      promote:
        description: 'Preview only, or promote this commit to production after approval'
        type: choice
        default: preview-only
        options: [preview-only, production]
      ref:
        description: 'Commit SHA on main to deploy (blank = current main)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-wrldline-public
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.0'

jobs:
  test:
    name: Worker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Syntax check
        run: node --check cloudflare/workers/wrldline-public/worker.js
      - name: Route ownership, version contract and asset pins
        run: |
          node --test tests/deploy-config.test.js tests/worker-version.test.js tests/worker-asset-pins.test.js
      - name: Existing public route behaviour
        run: node --test tests/public-news.test.js

  preview:
    name: Deploy preview
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: worker-preview
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve deployment identity
        id: meta
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Deploy preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd cloudflare/workers/wrldline-public
          npx --yes wrangler@4 deploy --env preview \
            --var GIT_COMMIT:${{ steps.meta.outputs.commit }} \
            --var DEPLOYED_AT:${{ steps.meta.outputs.deployed_at }} \
            --var WORKER_SERVICE:wrldline-public-preview 2>&1 | tee /tmp/preview-deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/preview-deploy.log | tail -1)"
          if [ -z "$url" ]; then echo "::error::wrangler did not report a workers.dev URL"; exit 1; fi
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url"
      - name: Verify the preview reports this commit
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          EXPECTED: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          version="$(curl --fail --silent --show-error "$PREVIEW_URL/__version")"
          echo "$version"
          commit="$(printf '%s' "$version" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).commit))')"
          env_name="$(printf '%s' "$version" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).environment))')"
          test "$commit" = "$EXPECTED" || { echo "::error::preview reports $commit, expected $EXPECTED"; exit 1; }
          test "$env_name" = "preview" || { echo "::error::preview reports environment '$env_name'"; exit 1; }
      - name: Preview smoke checks
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          for route in /news/ /section/politics /rss.xml /atom.xml /news-sitemap.xml /article-sitemap.xml; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 45 "$PREVIEW_URL$route")"
            echo "$route -> $code"
            test "$code" = "200" || { echo "::error::$route returned $code on preview"; exit 1; }
          done
      - name: Parity report against production (informational)
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          node scripts/worker-parity.mjs --left=https://al-ghaib.us.ci --right="$PREVIEW_URL" --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Preview evidence
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          {
            echo "## Worker preview"
            echo ""
            echo "- commit: \`$COMMIT\`"
            echo "- preview: $PREVIEW_URL"
            echo "- logs: attached as artifact"
            echo ""
            echo "Promote with: Actions → Deploy WRLDLINE public Worker → Run workflow → promote=production → ref=$COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wrldline-worker-preview-${{ steps.meta.outputs.commit }}
          path: /tmp/preview-deploy.log
          retention-days: 14

  production:
    name: Promote to production (requires approval)
    needs: [test, preview]
    if: github.event_name == 'workflow_dispatch' && inputs.promote == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Required reviewers on this environment are the manual approval gate. The
    # job does not start until a reviewer approves it.
    environment:
      name: production-worker
      url: https://al-ghaib.us.ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.preview.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Refuse to promote anything other than the approved commit
        env:
          APPROVED: ${{ needs.preview.outputs.commit }}
          CHECKED_OUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$APPROVED" || { echo "::error::checked out $actual but approved $APPROVED"; exit 1; }
          echo "Promoting $actual"
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ needs.preview.outputs.commit }}
        run: |
          set -euo pipefail
          cd cloudflare/workers/wrldline-public
          npx --yes wrangler@4 deploy --env production \
            --var GIT_COMMIT:"$COMMIT" \
            --var DEPLOYED_AT:"$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --var WORKER_SERVICE:wrldline-public 2>&1 | tee /tmp/production-deploy.log
      - name: Strictly verify the live deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ needs.preview.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/verify-deployment.mjs --expect-sha="$COMMIT" --expect-worker-sha="$COMMIT" --strict
      - name: Record the released commit
        env:
          COMMIT: ${{ needs.preview.outputs.commit }}
        run: |
          {
            echo "## Worker promoted to production"
            echo ""
            echo "- commit: \`$COMMIT\`"
            echo "- verification: \`scripts/verify-deployment.mjs --strict\` passed"
            echo "- rollback: Actions → Roll back WRLDLINE public Worker → ref=$COMMIT^ (previous known-good)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wrldline-worker-production-${{ needs.preview.outputs.commit }}
          path: /tmp/production-deploy.log
          retention-days: 90
