name: Roll back WRLDLINE public Worker

# Restores a previously verified commit of the public Worker.
#
# Rules this workflow enforces:
#   * the target must exist on main (no arbitrary refs, no local branches)
#   * the rollback deploy is stamped with the target commit, so /__version
#     reports what is actually live afterwards
#   * production rollback still goes through the `production-worker`
#     environment, because rolling back is a production change
#
# Nothing here is automatic: it is a deliberate, logged action.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA on main to restore (must be an ancestor of main)'
        type: string
        required: true
      target:
        description: 'Environment to roll back'
        type: choice
        default: production
        options: [production, preview]
      reason:
        description: 'What is being rolled back and why (recorded in the summary)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-wrldline-public
  cancel-in-progress: false

jobs:
  validate:
    name: Validate rollback target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - name: Resolve and vet the target commit
        id: resolve
        env:
          TARGET: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify "${TARGET}^{commit}")"
          git merge-base --is-ancestor "$commit" main || { echo "::error::$commit is not on main"; exit 1; }
          git cat-file -e "$commit:cloudflare/workers/wrldline-public/worker.js" || { echo "::error::$commit has no Worker source"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $commit"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.0'
      - name: The target must pass the route/version contract
        env:
          TARGET: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET"
          node --check cloudflare/workers/wrldline-public/worker.js
          # Older commits may predate these tests; run them only when present so a
          # rollback is never blocked by a test that did not exist yet.
          for test_file in tests/deploy-config.test.js tests/worker-version.test.js tests/worker-asset-pins.test.js; do
            [ -f "$test_file" ] && node --test "$test_file" || echo "skip $test_file (not in target)"
          done

  rollback:
    name: Deploy rollback
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.target == 'production' && 'production-worker' || 'worker-preview' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.0'
      - name: Deploy the target commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          cd cloudflare/workers/wrldline-public
          npx --yes wrangler@4 deploy --env "$TARGET" \
            --var GIT_COMMIT:"$COMMIT" \
            --var DEPLOYED_AT:"$(date -u +%Y-%m-%dT%H:%M:%SZ)" 2>&1 | tee /tmp/rollback.log
      - name: Confirm the live deployment reports the rollback commit
        if: inputs.target == 'production'
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/verify-deployment.mjs --expect-worker-sha="$COMMIT" --strict
      - name: Summary
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          TARGET: ${{ inputs.target }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## Worker rollback"
            echo ""
            echo "- environment: $TARGET"
            echo "- restored commit: \`$COMMIT\`"
            echo "- reason: $REASON"
            echo "- performed by: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
