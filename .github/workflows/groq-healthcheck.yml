name: AI Provider Healthcheck
on:
  push:
    branches: [main]
    paths:
      - 'groq-healthcheck.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-groq:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Gemini, Groq classification and translation responses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node ai-provider-healthcheck.js
