name: WRLDLINE Backup Restore Drill
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_backup:
        description: 'Read-only production logical export, then restore ONLY in throwaway local Docker (requires protected environment)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: backup-restore-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Install encryption utility
        run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends age
      - name: Check script safety and isolated fixtures
        run: python -m unittest discover -s tests -p 'reliability_backup_test.py' -v
      - name: Synthetic encrypted restore, NOT a production backup
        env:
          DR_POSTGRES_IMAGE: postgres:17.6-bookworm
        run: python scripts/backup-synthetic-drill.py
  manual-real-backup:
    if: github.event_name == 'workflow_dispatch' && inputs.real_backup && github.ref == 'refs/heads/main'
    environment: production-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Install pinned backup client and encryption utility
        run: |
          python -m pip install 'psycopg[binary]==3.2.13'
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
      - name: Read-only consistent export encrypted outside checkout
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          DR_POSTGRES_IMAGE: ${{ vars.DR_POSTGRES_IMAGE || 'postgres:17.6-bookworm' }}
        run: python scripts/backup-create.py --output "$RUNNER_TEMP/wrldline-backup.age"
      - name: Restore actual encrypted export into local container only
        env:
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          DR_POSTGRES_IMAGE: ${{ vars.DR_POSTGRES_IMAGE || 'postgres:17.6-bookworm' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          identity="$RUNNER_TEMP/backup-identity"
          trap 'rm -f "$identity"' EXIT
          printf '%s\n' "$AGE_IDENTITY" >"$identity"
          python scripts/restore-drill.py --backup "$RUNNER_TEMP/wrldline-backup.age" --identity "$identity" --require-real
      - name: Retain encrypted artifact only, even when restore flags an incompatibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-wrldline-logical-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/wrldline-backup.age
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
      - name: Remove encryption identity and encrypted runner file
        if: always()
        run: rm -f "$RUNNER_TEMP/backup-identity" "$RUNNER_TEMP/wrldline-backup.age"
