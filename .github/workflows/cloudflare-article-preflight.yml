name: Cloudflare article release preflight
on:
  push:
    branches: [ops/cloudflare-article-preflight]
    paths: [.github/workflows/cloudflare-article-preflight.yml]
permissions: {}
jobs:
  production-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify only the existing article Worker and route
        env:
          CF_PREFLIGHT_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_PREFLIGHT_TOKEN" ]]; then
            echo 'Cloudflare credential unavailable to this job.'
            exit 1
          fi
          temp="$(mktemp -d)"
          trap 'rm -rf -- "$temp"' EXIT
          request() {
            curl --silent --show-error --connect-timeout 7 --max-time 20 \
              --proto '=https' --output "$temp/response.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $CF_PREFLIGHT_TOKEN" \
              "https://api.cloudflare.com/client/v4/$1"
          }
          result="$(request 'zones?name=al-ghaib.us.ci')"
          if [[ "$result" != '200' ]]; then
            printf 'Cloudflare did not grant a zone lookup (HTTP %s).\n' "$result"
            exit 1
          fi
          zone="$(jq -er 'select(.success == true) | [.result[] | select(.name == "al-ghaib.us.ci" and .status == "active")] | select(length == 1) | .[0].id | select(test("^[0-9a-f]{32}$"))' "$temp/response.json")"
          account="$(jq -er --arg zone "$zone" '.result[] | select(.id == $zone) | .account.id | select(test("^[0-9a-f]{32}$"))' "$temp/response.json")"
          result="$(request "zones/$zone/workers/routes")"
          if [[ "$result" != '200' ]]; then
            printf 'Cloudflare did not grant the route lookup (HTTP %s).\n' "$result"
            exit 1
          fi
          jq -e '.success == true and any(.result[]; .pattern == "al-ghaib.us.ci/news/*" and .script == "wrldline-public")' "$temp/response.json" >/dev/null \
            || { echo 'Expected article route was not confirmed.'; exit 1; }
          result="$(request "accounts/$account/workers/scripts/wrldline-public/deployments")"
          if [[ "$result" != '200' ]]; then
            printf 'Cloudflare did not grant the deployment lookup (HTTP %s).\n' "$result"
            exit 1
          fi
          jq -e '.success == true and (.result.deployments[0].versions | length == 1) and .result.deployments[0].versions[0].percentage == 100' "$temp/response.json" >/dev/null \
            || { echo 'A single active Worker version at 100% was not confirmed.'; exit 1; }
          echo 'Confirmed active article Worker and route. No production changes made.'
          active="$(jq -er '.result.deployments[0].versions[0].version_id | select(test("^[0-9a-f-]{36}$"))' "$temp/response.json")"
          result="$(request "accounts/$account/workers/workers/wrldline-public/versions/$active?include=modules")"
          if [[ "$result" != '200' ]]; then
            printf 'Cloudflare did not grant the active module lookup (HTTP %s).\n' "$result"
            exit 1
          fi
          jq -e '.success == true and (.result.modules | length == 1) and (.result.modules[0].content_type == "application/javascript+module")' "$temp/response.json" >/dev/null \
            || { echo 'The active Worker does not have the expected single JavaScript module.'; exit 1; }
          jq -r '.result.modules[0].content_base64' "$temp/response.json" | base64 --decode > "$temp/active.mjs"
          curl --fail --silent --show-error --proto '=https' --max-time 15 \
            'https://raw.githubusercontent.com/bader11pq-sys/Wrldline-news/9f1e6bc7cc74ce40e3f3f2ecdafb3e792f713f71/cloudflare/workers/wrldline-public/worker.js' --output "$temp/main.mjs"
          if cmp -s "$temp/active.mjs" "$temp/main.mjs"; then
            echo 'Active source matches the protected repository baseline byte for byte.'
          else
            echo 'Active source differs from the raw repository baseline.'
            if grep -Fq 'text(article.event_country || article.country, 120)' "$temp/active.mjs"; then echo 'The narrow country fallback patch anchor is present.'; fi
            if grep -Fq 'function renderArticle(article, now, trust' "$temp/active.mjs"; then echo 'The expected article renderer anchor is present.'; fi
          fi
          jq -e '.result.bindings | (map(.name) | sort) == ["PUBLIC_TRUST_ENABLED","SUPABASE_ANON_KEY","SUPABASE_URL"] and all(.[]; .type == "plain_text")' "$temp/response.json" >/dev/null \
            || { echo 'The active bindings differ from the repository contract.'; exit 1; }
          echo 'The active Worker has exactly the three expected environment bindings.'
