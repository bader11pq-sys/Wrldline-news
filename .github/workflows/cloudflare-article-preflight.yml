name: Cloudflare article release preflight
on:
  push:
    branches: [ops/cloudflare-article-preflight]
    paths: [.github/workflows/cloudflare-article-preflight.yml]
permissions: {}
jobs:
  production-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify only the existing article Worker and route
        env:
          CF_PREFLIGHT_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_PREFLIGHT_TOKEN" ]]; then
            echo 'Cloudflare credential unavailable to this job.'
            exit 1
          fi
          temp="$(mktemp -d)"
          trap 'rm -rf -- "$temp"' EXIT
          request() {
            curl --silent --show-error --connect-timeout 7 --max-time 20 \
              --proto '=https' --output "$temp/response.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $CF_PREFLIGHT_TOKEN" \
              "https://api.cloudflare.com/client/v4/$1"
          }
          result="$(request 'zones?name=al-ghaib.us.ci')"
          if [[ "$result" != '200' ]]; then
            printf 'Cloudflare did not grant a zone lookup (HTTP %s).\n' "$result"
            exit 1
          fi
          zone="$(jq -er 'select(.success == true) | [.result[] | select(.name == "al-ghaib.us.ci" and .status == "active")] | select(length == 1) | .[0].id | select(test("^[0-9a-f]{32}$"))' "$temp/response.json")"
          account="$(jq -er --arg zone "$zone" '.result[] | select(.id == $zone) | .account.id | select(test("^[0-9a-f]{32}$"))' "$temp/response.json")"
          result="$(request "zones/$zone/workers/routes")"
          if [[ "$result" != '200' ]]; then
            printf 'Cloudflare did not grant the route lookup (HTTP %s).\n' "$result"
            exit 1
          fi
          jq -e '.success == true and any(.result[]; .pattern == "al-ghaib.us.ci/news/*" and .script == "wrldline-public")' "$temp/response.json" >/dev/null \
            || { echo 'Expected article route was not confirmed.'; exit 1; }
          result="$(request "accounts/$account/workers/scripts/wrldline-public/deployments")"
          if [[ "$result" != '200' ]]; then
            printf 'Cloudflare did not grant the deployment lookup (HTTP %s).\n' "$result"
            exit 1
          fi
          jq -e '.success == true and (.result.deployments[0].versions | length == 1) and .result.deployments[0].versions[0].percentage == 100' "$temp/response.json" >/dev/null \
            || { echo 'A single active Worker version at 100% was not confirmed.'; exit 1; }
          echo 'Confirmed active article Worker and route. No production changes made.'
