name: WRLDLINE AI Backlog Processor (manual fallback)
# Supabase cron `wrldline-ai-classification-worker` is the single scheduled
# classifier. This workflow is a manual fallback for operators only.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wrldline-ai-backlog
  cancel-in-progress: false
jobs:
  process-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Drain one pending and one failed article (manual fallback)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node classify-pending.js
