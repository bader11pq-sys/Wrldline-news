name: WRLDLINE Code Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(git ls-files '*.js')
      - name: Validate JSON configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json','utf8')); console.log('manifest.json is valid JSON')"
      - name: Verify local HTML assets exist
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pages = ['index.html','account.html','admin.html','history.html','map.html'];
          const missing = [];
          for (const page of pages) {
            const html = fs.readFileSync(page, 'utf8');
            const refs = [...html.matchAll(/<(?:script|link)\b[^>]*(?:src|href)=["']([^"']+)["']/gi)];
            for (const [, raw] of refs) {
              if (/^(?:https?:|data:|mailto:|#|\/\/)/i.test(raw)) continue;
              const local = raw.split(/[?#]/, 1)[0];
              if (!local || !fs.existsSync(path.resolve(local))) missing.push(page + ' -> ' + raw);
            }
          }
          if (missing.length) {
            console.error('Missing local assets:\n' + missing.join('\n'));
            process.exit(1);
          }
          console.log('All local HTML assets exist.');
          NODE
