name: WRLDLINE Production Readiness
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-regressions:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Install pinned check-only browser tooling
        run: |
          python -m pip install 'playwright==1.56.0'
          # The hosted Ubuntu image already ships Chrome's runtime libraries.
          # Playwright 1.56's optional apt installer asks for obsolete font packages.
          python -m playwright install chromium
      - name: Mocked consent, mobile, and failure browser regressions
        env:
          WRLDLINE_BROWSER_ISOLATED: '1'
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/wrldline-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python tests/reliability-browser.py
          python tests/newsroom-edition-browser.py
          python tests/editorial-standards-browser.py
          python tests/event-desk-browser.py
          python tests/world-monitor-browser.py
          python tests/reading-paths-browser.py
          python tests/shorts-browser.py
          python tests/rights-desk-browser.py
          python tests/premium-reading-browser.py
          python tests/site-editor-browser.py
          python tests/country-browser.py
          python tests/economy-browser.py
          python tests/news-map-browser.py
          python tests/touch-targets-browser.py
          python tests/accessibility-browser.py
          python tests/newsroom-desk-browser.py
  source-freshness:
    # Opt-in prevents missing secrets and duplicate pg_cron scheduling from being
    # silently treated as working monitors. Only protected trusted branches get secrets.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.FRESHNESS_MONITOR_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: production-monitoring
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.0'
      - name: Evaluate actual ingested sources (no outbound alerts)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          WRLDLINE_CRON_SECRET: ${{ secrets.WRLDLINE_CRON_SECRET }}
        run: node scripts/source-freshness-check.mjs
