name: WRLDLINE retired breaking RSS status (manual)
# Diagnostic only. The legacy breaking collector must not be scheduled.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wrldline-breaking-manual
  cancel-in-progress: false
jobs:
  breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Report that legacy breaking RSS collection is disabled
        run: node bot-breaking.js
