name: WRLDLINE Breaking News Desk
on:
  push:
    branches: [main]
    paths:
      - 'bot-breaking.js'
      - 'source-catalog.json'
      - '.github/workflows/breaking.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wrldline-breaking-manual
  cancel-in-progress: false
jobs:
  breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate catalog and invoke the shared Supabase monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node bot-breaking.js
