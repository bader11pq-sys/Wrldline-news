name: WRLDLINE retired breaking RSS status (manual)
# Diagnostic only. The legacy breaking collector must not be scheduled.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wrldline-breaking-manual
  cancel-in-progress: false
jobs:
  breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Report that legacy breaking RSS collection is disabled
        run: node bot-breaking.js
