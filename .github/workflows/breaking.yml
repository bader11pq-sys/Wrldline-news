name: WRLDLINE Breaking News Desk
on:
  push:
    branches: [main]
    paths:
      - 'bot-breaking.js'
      - '.github/workflows/breaking.yml'
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wrldline-breaking-ingestion
  cancel-in-progress: false
jobs:
  breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect breaking alerts from Arabic and global publishers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node bot-breaking.js
      - name: Dispatch opted-in SMS alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error -X POST "$SUPABASE_URL/functions/v1/telnyx-gateway" \\
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \\
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \\
            -H "Content-Type: application/json" \\
            -d '{"action":"dispatch_breaking"}'
