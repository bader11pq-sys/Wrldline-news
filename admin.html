<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | وكالة الغيب</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #09090b;
        --surface: #18181b;
        --border: #27272a;
        --text: #f4f4f5;
        --text-muted: #a1a1aa;
        --brand: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'IBM Plex Sans Arabic', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.6;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }
    .container {
        width: 100%;
        max-width: 700px;
        background: var(--surface);
        padding: 32px;
        border-radius: 16px;
        border: 1px solid var(--border);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
    }
    .header h1 { font-size: 1.5rem; color: var(--brand); }
    .btn-dashboard {
        font-size: 0.9rem; color: var(--text-muted); text-decoration: none; transition: 0.2s;
    }
    .btn-dashboard:hover { color: var(--text); }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; }
    input, select, textarea {
        width: 100%;
        padding: 12px 16px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: inherit;
        font-size: 1rem;
        transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
    textarea { resize: vertical; min-height: 150px; }
    
    .btn-submit {
        width: 100%;
        padding: 16px;
        background: var(--brand);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 10px;
    }
    .btn-submit:hover { background: #dc2626; }
    .btn-submit:disabled { background: #7f1d1d; cursor: not-allowed; }

    .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #10b981;
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        transition: transform 0.3s;
        z-index: 1000;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--brand); }
    .hidden { display: none; }
</style>
</head>
<body>

<div class="container" id="loginScreen">
    <div class="header"><h1>تسجيل الدخول</h1></div>
    <div class="form-group">
        <label>رمز المرور السري (Password)</label>
        <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور...">
    </div>
    <button class="btn-submit" onclick="checkPassword()">دخول</button>
</div>

<div class="container hidden" id="adminPanel">
    <div class="header">
        <h1>لوحة تحكم الغيب</h1>
        <a href="index.html" class="btn-dashboard">زيارة الموقع &larr;</a>
    </div>

    <form id="newsForm">
        <div class="form-group">
            <label>عنوان الخبر الرئيسي</label>
            <input type="text" id="title" required placeholder="مثال: الإمارات تبيع نفطاً سعودياً من ناقلة عملاقة...">
        </div>
        
        <div class="form-group">
            <label>نص الخبر الكامل (ملخص)</label>
            <textarea id="summary" required placeholder="اكتب تفاصيل الخبر هنا بالكامل..."></textarea>
        </div>

        <div class="form-group">
            <label>رابط الصورة (Image URL)</label>
            <input type="url" id="image_url" placeholder="https://example.com/image.jpg">
            <small style="color:var(--text-muted); font-size:0.8rem; margin-top:4px; display:block;">اتركه فارغاً لوضع صورة عشوائية.</small>
        </div>

        <div class="form-group">
            <label>القسم</label>
            <select id="category">
                <option value="politics">سياسة</option>
                <option value="economy">اقتصاد</option>
                <option value="security">أمن ودفاع</option>
                <option value="world">العالم</option>
            </select>
        </div>

        <div class="form-group">
            <label>اسم المصدر</label>
            <input type="text" id="source_name" value="محرر المنصة" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">نشر الخبر الآن 🚀</button>
    </form>
</div>

<div class="toast" id="toast">تم نشر الخبر بنجاح!</div>

<script>
    const SUPABASE_URL = "https://vmaxbnogmmfyrcucapnq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_D3c88u75_LcEN460Y3Jcpw__EfqUnBx";
    
    // ⚠️ غير كلمة المرور هذه إلى أي كلمة تريدها
    const ADMIN_PASSWORD = "AlGhaib2026"; 

    function checkPassword() {
        const pass = document.getElementById('adminPassword').value;
        if (pass === ADMIN_PASSWORD) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
        } else {
            showToast("كلمة المرور غير صحيحة!", true);
        }
    }

    document.getElementById('newsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "جاري النشر...";

        const title = document.getElementById('title').value;
        const summary = document.getElementById('summary').value;
        const image_url = document.getElementById('image_url').value;
        const category = document.getElementById('category').value;
        const source_name = document.getElementById('source_name').value;

        // توليد رابط فريد للخبر باستخدام الوقت الحالي
        const uniqueUrl = 'news-' + Date.now();

        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/articles`, {
                method: 'POST',
                headers: {
                    apikey: SUPABASE_ANON_KEY,
                    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                    url: uniqueUrl,
                    title: title,
                    summary: summary,
                    image_url: image_url || null,
                    category: category,
                    source_name: source_name,
                    source_url: '#',
                    lang: 'ar',
                    verification: 'confirmed',
                    published_at: new Date().toISOString()
                })
            });

            if (!res.ok) throw new Error("فشل النشر");

            showToast("تم نشر الخبر بنجاح!");
            document.getElementById('newsForm').reset();
            
        } catch (error) {
            console.error(error);
            showToast("حدث خطأ أثناء النشر، تأكد من الصلاحيات.", true);
        } finally {
            btn.disabled = false;
            btn.innerText = "نشر الخبر الآن 🚀";
        }
    });

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.className = 'toast show' + (isError ? ' error' : '');
        setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }
</script>

</body>
</html>
