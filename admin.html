<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | وكالة الغيب</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root { --bg: #09090b; --surface: #18181b; --border: #27272a; --text: #f4f4f5; --text-muted: #a1a1aa; --brand: #ef4444; --success: #10b981; --info: #3b82f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; display: flex; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 800px; background: var(--surface); padding: 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .header h1 { font-size: 1.3rem; color: var(--brand); }
    .btn-dashboard { font-size: 0.85rem; color: var(--text-muted); text-decoration: none; background: #27272a; padding: 6px 12px; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 0.95rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
    textarea { resize: vertical; min-height: 100px; }
    input[type="file"] { padding: 8px; background: var(--surface); border: 1px dashed var(--border); }
    .btn-submit { width: 100%; padding: 14px; background: var(--brand); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-submit:hover { background: #dc2626; }
    .btn-submit:disabled { background: #7f1d1d; cursor: not-allowed; }
    .btn-cancel { width: 100%; padding: 10px; background: #27272a; color: #fff; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 10px; display: none; }
    
    .manage-section { margin-top: 30px; border-top: 2px solid var(--border); padding-top: 20px; }
    .manage-title { font-size: 1.2rem; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .article-list { display: flex; flex-direction: column; gap: 10px; max-height: 500px; overflow-y: auto; padding-left: 5px; }
    .article-item { background: var(--bg); border: 1px solid var(--border); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .article-info { flex: 1; }
    .article-info h4 { font-size: 0.95rem; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .article-info span { font-size: 0.75rem; color: var(--text-muted); }
    .article-actions { display: flex; gap: 6px; }
    .btn-action { padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; color: #fff; }
    .btn-edit { background: var(--info); }
    .btn-delete { background: var(--brand); }
    
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--success); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 600; transition: transform 0.3s; z-index: 1000; text-align: center; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--brand); }
    .hidden { display: none !important; }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div class="container" id="loginScreen">
    <div class="header" style="justify-content: center; border: none;">
        <h1>تسجيل الدخول للوحة التحكم</h1>
    </div>
    <div class="form-group">
        <label>رمز المرور السري (Password)</label>
        <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور...">
    </div>
    <button class="btn-submit" onclick="checkPassword()">دخول</button>
</div>

<!-- لوحة التحكم (مخفية في البداية) -->
<div class="container hidden" id="adminPanel">
    <div class="header">
        <h1>لوحة تحكم الغيب</h1>
        <a href="index.html" class="btn-dashboard">زيارة الموقع &larr;</a>
    </div>

    <!-- نموذج النشر/التعديل -->
    <form id="newsForm">
        <input type="hidden" id="editId" value="">
        
        <div class="form-group">
            <label>عنوان الخبر الرئيسي</label>
            <input type="text" id="title" required placeholder="اكتب العنوان هنا...">
        </div>
        
        <div class="form-group">
            <label>نص الخبر الكامل</label>
            <textarea id="summary" required placeholder="اكتب تفاصيل الخبر هنا..."></textarea>
        </div>

        <div class="form-group">
            <label>الوسائط (اختر صورة أو فيديو - اختياري)</label>
            <input type="file" id="mediaFile" accept="image/*,video/*">
            <small style="color:var(--text-muted); font-size:0.8rem; margin-top:4px; display:block;">اتركه فارغاً إذا كنت تعدل خبراً ولا تريد تغيير الصورة.</small>
        </div>

        <div class="form-group">
            <label>القسم</label>
            <select id="category">
                <option value="politics">سياسة</option>
                <option value="economy">اقتصاد</option>
                <option value="security">أمن ودفاع</option>
                <option value="world">العالم</option>
                <option value="sports">رياضة</option>
                <option value="tech">تكنولوجيا</option>
                <option value="culture">ثقافة</option>
                <option value="health">صحة</option>
            </select>
        </div>

        <div class="form-group">
            <label>الدولة (لتظهر على الخريطة)</label>
            <select id="country">
                <option value="">بدون دولة (دولي)</option>
                <option value="السعودية">السعودية</option>
                <option value="فلسطين">فلسطين</option>
                <option value="أوكرانيا">أوكرانيا</option>
                <option value="الولايات المتحدة">الولايات المتحدة</option>
                <option value="روسيا">روسيا</option>
                <option value="إيران">إيران</option>
                <option value="تركيا">تركيا</option>
                <option value="مصر">مصر</option>
                <option value="اليمن">اليمن</option>
                <option value="الإمارات">الإمارات</option>
                <option value="قطر">قطر</option>
                <option value="الكويت">الكويت</option>
                <option value="الأردن">الأردن</option>
                <option value="لبنان">لبنان</option>
                <option value="سوريا">سوريا</option>
                <option value="العراق">العراق</option>
                <option value="المغرب">المغرب</option>
                <option value="الجزائر">الجزائر</option>
                <option value="تونس">تونس</option>
                <option value="ليبيا">ليبيا</option>
                <option value="السودان">السودان</option>
            </select>
        </div>

        <div class="form-group">
            <label>اسم المصدر</label>
            <input type="text" id="source_name" value="محرر المنصة" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">نشر الخبر الآن 🚀</button>
        <button type="button" class="btn-cancel" id="cancelEditBtn" onclick="cancelEdit()">إلغاء التعديل</button>
    </form>

    <!-- إدارة الأخبار -->
    <div class="manage-section">
        <div class="manage-title">
            <h2>إدارة الأخبار المنشورة</h2>
            <button onclick="fetchArticles()" style="background:transparent; border:none; color:var(--info); cursor:pointer; font-weight:bold;">🔄 تحديث</button>
        </div>
        <div class="article-list" id="articlesList">
            <p style="color:var(--text-muted); text-align:center;">جاري تحميل الأخبار...</p>
        </div>
    </div>
</div>

<div class="toast" id="toast">تم!</div>

<script>
    const SUPABASE_URL = "https://vmaxbnogmmfyrcucapnq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_D3c88u75_LcEN460Y3Jcpw__EfqUnBx";
    const ADMIN_PASSWORD = "Badered2009"; 

    function checkPassword() {
        const pass = document.getElementById('adminPassword').value;
        if (pass === ADMIN_PASSWORD) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            fetchArticles(); // جلب الأخبار عند الدخول
        } else {
            showToast("كلمة المرور غير صحيحة!", true);
        }
    }

    // 1. جلب الأخبار وعرضها في القائمة
    async function fetchArticles() {
        const list = document.getElementById('articlesList');
        list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">جاري التحميل...</p>';
        
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/articles?select=*&order=published_at.desc&limit=50`, {
                headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
            });
            const data = await res.json();
            
            if (data.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">لا توجد أخبار.</p>';
                return;
            }

            list.innerHTML = data.map(a => `
                <div class="article-item">
                    <div class="article-info">
                        <h4>${a.title}</h4>
                        <span>${a.source_name} • ${new Date(a.published_at).toLocaleDateString('ar-EG')}</span>
                    </div>
                    <div class="article-actions">
                        <button class="btn-action btn-edit" onclick='editArticle(${JSON.stringify(a).replace(/'/g, "&#39;")})'>تعديل</button>
                        <button class="btn-action btn-delete" onclick="deleteArticle('${a.id}')">حذف</button>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            list.innerHTML = '<p style="color:red; text-align:center;">حدث خطأ في جلب الأخبار.</p>';
        }
    }

    // 2. حذف خبر
    async function deleteArticle(id) {
        if (!confirm("هل أنت متأكد من حذف هذا الخبر نهائياً؟")) return;
        
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/articles?id=eq.${id}`, {
                method: 'DELETE',
                headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
            });
            
            if (res.ok) {
                showToast("تم حذف الخبر بنجاح");
                fetchArticles(); // تحديث القائمة
            } else {
                showToast("فشل الحذف. تأكد من صلاحيات قاعدة البيانات.", true);
            }
        } catch (e) {
            showToast("حدث خطأ أثناء الحذف", true);
        }
    }

    // 3. تجهيز النموذج للتعديل
    function editArticle(article) {
        document.getElementById('editId').value = article.id;
        document.getElementById('title').value = article.title;
        document.getElementById('summary').value = article.summary || '';
        document.getElementById('category').value = article.category || 'world';
        document.getElementById('country').value = article.country || '';
        document.getElementById('source_name').value = article.source_name || 'محرر المنصة';
        
        // تغيير شكل الأزرار
        document.getElementById('submitBtn').innerText = "حفظ التعديلات 💾";
        document.getElementById('submitBtn').style.background = "var(--info)";
        document.getElementById('cancelEditBtn').style.display = "block";
        
        // التمرير للأعلى
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // إلغاء التعديل
    function cancelEdit() {
        document.getElementById('editId').value = "";
        document.getElementById('newsForm').reset();
        document.getElementById('submitBtn').innerText = "نشر الخبر الآن 🚀";
        document.getElementById('submitBtn').style.background = "var(--brand)";
        document.getElementById('cancelEditBtn').style.display = "none";
    }

    // 4. إرسال النموذج (نشر جديد أو حفظ تعديل)
    document.getElementById('newsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const editId = document.getElementById('editId').value;
        btn.disabled = true;
        btn.innerText = "جاري المعالجة...";

        const title = document.getElementById('title').value;
        const summary = document.getElementById('summary').value;
        const category = document.getElementById('category').value;
        const country = document.getElementById('country').value;
        const source_name = document.getElementById('source_name').value;
        const fileInput = document.getElementById('mediaFile');
        
        let mediaUrl = undefined; // undefined يعني لا نغير الصورة الحالية
        let mediaType = 'image';

        try {
            // رفع الملف إذا تم اختياره
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;
                const filePath = `uploads/${fileName}`;

                if (file.type.startsWith('video/')) mediaType = 'video';

                const formData = new FormData();
                formData.append('file', file);

                const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/news-media/${filePath}`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: formData
                });

                if (!uploadRes.ok) throw new Error("فشل رفع الملف");
                mediaUrl = `${SUPABASE_URL}/storage/v1/object/public/news-media/${filePath}`;
            }

            // تجهيز البيانات
            const articleData = {
                title: title,
                summary: summary,
                category: category,
                country: country || null,
                source_name: source_name
            };
            
            // إذا تم رفع صورة جديدة، نضيفها للبيانات
            if (mediaUrl !== undefined) {
                articleData.image_url = mediaUrl;
                articleData.media_type = mediaType;
            }

            // تحديد هل هو تعديل أم نشر جديد
            const method = editId ? 'PATCH' : 'POST';
            const url = editId ? `${SUPABASE_URL}/rest/v1/articles?id=eq.${editId}` : `${SUPABASE_URL}/rest/v1/articles`;
            
            if (!editId) {
                articleData.url = 'news-' + Date.now();
                articleData.lang = 'ar';
                articleData.verification = 'confirmed';
                articleData.published_at = new Date().toISOString();
            }

            const res = await fetch(url, {
                method: method,
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(articleData)
            });

            if (!res.ok) throw new Error("فشل الحفظ");

            showToast(editId ? "تم حفظ التعديلات بنجاح" : "تم نشر الخبر بنجاح");
            cancelEdit(); // إعادة تعيين النموذج
            fetchArticles(); // تحديث القائمة
            
        } catch (error) {
            showToast("حدث خطأ: " + error.message, true);
        } finally {
            btn.disabled = false;
            btn.innerText = editId ? "حفظ التعديلات 💾" : "نشر الخبر الآن 🚀";
        }
    });

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.className = 'toast show' + (isError ? ' error' : '');
        setTimeout(() => { toast.classList.remove('show'); }, 4000);
    }
</script>
</body>
</html>
